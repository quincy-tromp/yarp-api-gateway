name: Deploy Infra

env:
    BICEP_TEMPLATE_FILE: infra/main.bicep
    BICEP_PARAMETERS_FILE: infra/main.bicepparam

on:
    push:
        branches:
            - main
        paths:
            - 'infra/**' 
            - ".github/workflows/deploy.infra.yml"
    workflow_dispatch: 

permissions:
    contents: read
    id-token: write

jobs:
    deploy-infra:
        name: Deploy Infra Job
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to Azure
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Deploy bicep template
              uses: azure/bicep-deploy@v2
              env:
                PRODUCT_API_CLIENT_ID: ${{ secrets.PRODUCT_API_CLIENT_ID }}
                ORDER_API_CLIENT_ID: ${{ secrets.ORDER_API_CLIENT_ID }}
                OVERVIEW_BFF_CLIENT_ID: ${{ secrets.OVERVIEW_BFF_CLIENT_ID }}
                OVERVIEW_BFF_CLIENT_SECRET: ${{ secrets.OVERVIEW_BFF_CLIENT_SECRET }}
                JWT_AUTHORITY: ${{ secrets.JWT_AUTHORITY }}
                JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
                PRODUCT_API_SCOPE: ${{ secrets.PRODUCT_API_SCOPE }}
                ORDER_API_SCOPE: ${{ secrets.ORDER_API_SCOPE }}
                INTERNAL_GATEWAY_KEY: ${{ secrets.INTERNAL_GATEWAY_KEY }}
              with:
                  type: deployment
                  operation: create          
                  scope: resourceGroup
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
                  template-file: ${{ env.BICEP_TEMPLATE_FILE }}
                  parameters-file: ${{ env.BICEP_PARAMETERS_FILE }}